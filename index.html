<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CalculObra | TECTONICO</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        <h1>TECTONICO</h1>
        <p>CalculObra v0.5</p>
    </div>

</header>

<div class="app">

    <!-- ========================= -->
    <!-- SECTORES -->
    <!-- ========================= -->

    <aside class="sidebar">

    <h2 id="nombreObra">
    Sin nombre
</h2>

        <div id="sectores">

            <p class="mensaje-vacio">
                No hay sectores.
            </p>

        </div>

        <button id="nuevoSector">
            ➕ Nuevo Sector
        </button>

    </aside>

    <!-- ========================= -->
    <!-- RUBROS -->
    <!-- ========================= -->

    <main class="contenido">

        <h2>Rubros</h2>

        <div id="rubros">

            <p class="mensaje-vacio">
                Seleccione un sector.
            </p>

        </div>

        <button id="agregarRubro">
            ➕ Agregar Rubro
        </button>

    </main>

    <!-- ========================= -->
    <!-- DETALLE -->
    <!-- ========================= -->

    <aside class="materiales">

        <h2>Detalle</h2>

        <div id="detalle">

            <p class="mensaje-vacio">
                Seleccione un rubro para comenzar.
            </p>

        </div>

    </aside>

</div>

<!-- ========================= -->
<!-- MODAL CATÁLOGO -->
<!-- ========================= -->

<div id="modalCatalogo" class="modal oculto">

    <div class="modal-contenido">

        <div class="modal-header">

            <h2>Agregar Rubro</h2>

            <button id="cerrarModal">
                ✖
            </button>

        </div>

        <input
            type="text"
            id="buscarRubro"
            placeholder="Buscar rubro...">

        <div id="listaCatalogo">

            <!-- Se genera desde JavaScript -->

        </div>

    </div>

</div>

<script src="catalogo.js"></script>
<script src="baseCalculos.js"></script>
<script src="script.js"></script>

</body>
</html>
