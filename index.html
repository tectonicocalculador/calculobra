<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CalculObra | TECTONICO</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        <h1>TECTONICO</h1>
        <p>CalculObra v0.3</p>
    </div>

</header>

<div class="app">

    <!-- SECTORES -->

    <aside class="sidebar">

        <h2>Sectores</h2>

        <div id="sectores">

            <p class="mensaje-vacio">
                No hay sectores.
            </p>

        </div>

        <button id="nuevoSector">
            ➕ Nuevo Sector
        </button>

    </aside>

    <!-- RUBROS -->

    <main class="contenido">

        <h2>Rubros</h2>

        <div id="rubros">

            <p class="mensaje-vacio">
                Seleccione un sector.
            </p>

        </div>

        <button id="agregarRubro">
            ➕ Agregar Rubro
        </button>

    </main>

    <!-- DETALLE -->

    <aside class="materiales">

        <h2>Detalle</h2>

        <div id="detalle">

            <p class="mensaje-vacio">
                Seleccione un rubro para comenzar.
            </p>

        </div>

    </aside>

</div>

<script src="catalogo.js"></script>
<script src="script.js"></script>

</body>

</html>
