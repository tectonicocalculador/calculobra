<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CalculObra</title>

<style>

*{
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
margin:0;
background:#f4f4f4;
}

header{
background:#f7c600;
padding:25px;
text-align:center;
font-size:34px;
font-weight:bold;
box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.sub{
text-align:center;
margin-top:5px;
color:#555;
}

.container{

max-width:700px;
margin:35px auto;
padding:20px;

}

.card{

background:white;
padding:25px;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,.12);

}

input{

width:100%;
padding:16px;
margin-top:10px;
margin-bottom:20px;
font-size:20px;
border-radius:10px;
border:1px solid #ccc;

}

button{

width:100%;
padding:18px;
background:#f7c600;
border:none;
border-radius:10px;
font-size:22px;
font-weight:bold;
cursor:pointer;

}

button:hover{

background:#e5b800;

}

.resultado{

display:none;
margin-top:30px;

}

.material{

background:#fafafa;
padding:18px;
margin-bottom:15px;
border-left:8px solid #f7c600;
border-radius:10px;

}

.valor{

font-size:30px;
font-weight:bold;
margin-top:10px;

}

</style>

</head>

<body>

<header>

CalculObra

<div class="sub">

Calculadora de Materiales

</div>

</header>

<div class="container">

<div class="card">

<h2>Mampostería</h2>

<label>Largo del muro (m)</label>

<input id="largo" type="number" step="0.01">

<label>Alto del muro (m)</label>

<input id="alto" type="number" step="0.01">

<button onclick="calcular()">

CALCULAR

</button>

<div class="resultado" id="resultado">

<div class="material">

Área

<div class="valor" id="area"></div>

</div>

<div class="material">

🧱 Ladrillos

<div class="valor" id="ladrillos"></div>

</div>

<div class="material">

⚪ Cemento

<div class="valor" id="cemento"></div>

</div>

<div class="material">

🟤 Cal

<div class="valor" id="cal"></div>

</div>

<div class="material">

🟡 Arena

<div class="valor" id="arena"></div>

</div>

</div>

</div>

</div>

<script>

function calcular(){

let largo=parseFloat(document.getElementById("largo").value);

let alto=parseFloat(document.getElementById("alto").value);

if(isNaN(largo)||isNaN(alto)){

alert("Ingrese largo y alto");

return;

}

let area=largo*alto;

let ladrillos=Math.ceil(area*60);

let cemento=area*7.5;

let cal=area*7.3;

let arena=area*0.035;

document.getElementById("resultado").style.display="block";

document.getElementById("area").innerHTML=area.toFixed(2)+" m²";

document.getElementById("ladrillos").innerHTML=ladrillos+" unidades";

document.getElementById("cemento").innerHTML=cemento.toFixed(1)+" kg ("+Math.ceil(cemento/25)+" bolsas)";

document.getElementById("cal").innerHTML=cal.toFixed(1)+" kg ("+Math.ceil(cal/25)+" bolsas)";

document.getElementById("arena").innerHTML=arena.toFixed(3)+" m³";

}

</script>

</body>

</html>
